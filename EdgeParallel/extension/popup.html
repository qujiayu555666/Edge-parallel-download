<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edge 多线程下载</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><img class="mark" src="icons/icon48.png" width="38" height="38" alt=""><h1>Edge 多线程下载</h1></header>
  <main>
    <label class="switch-row" for="enabled"><span>自动加速</span><input type="checkbox" id="enabled"></label>
    <label class="field" for="connections"><span>并行连接上限</span><select id="connections"><option value="2">2 个连接</option><option value="4">4 个连接</option><option value="8">8 个连接</option><option value="16">16 个连接 · 默认</option><option value="32">32 个连接</option><option value="64">64 个连接</option></select></label>
    <label class="field" for="minBytes"><span>最小文件大小</span><select id="minBytes"><option value="1048576">1 MB</option><option value="8388608">8 MB · 推荐</option><option value="33554432">32 MB</option><option value="134217728">128 MB</option></select></label>
    <div class="status"><p id="active">正在读取状态…</p><p id="decision" role="status" aria-live="polite"></p><p id="transfer"></p><p id="result" role="status" aria-live="polite"></p></div>
    <div class="actions"><button id="test" type="button">检查连接</button><button id="downloads" type="button" class="primary">下载列表</button></div>
    <form id="directForm"><label for="directUrl">下载公开直链</label><input type="url" id="directUrl" placeholder="https://…/文件.zip" required><button id="directDownload" type="submit">开始下载</button></form>
  </main>
  <footer>思路参考 <a href="https://github.com/lZiMUl/PCL2" target="_blank" rel="noreferrer">PCL2</a> · 独立项目</footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
